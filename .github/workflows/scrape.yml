name: Daily price refresh

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC daily (~4-5am US Eastern)
  workflow_dispatch: {} # lets you run it by hand from the Actions tab

permissions:
  contents: write # allow committing the refreshed data.json back

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install scraper deps
        working-directory: scraper
        run: npm install

      - name: Install Chromium
        working-directory: scraper
        run: npx playwright install --with-deps chromium

      - name: Crawl store catalogs
        working-directory: scraper
        env:
          # Canonical product-matching (optional). Add repo secret ANTHROPIC_API_KEY
          # to enable LLM identity matching; without it the app uses its regex
          # matcher and nothing breaks. Set repo variable LLM_PROVIDER=openai +
          # secret OPENAI_API_KEY to use OpenAI instead.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
        run: node catalog.mjs

      - name: Commit refreshed prices
        run: |
          git config user.name "kosher-cut-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json scraper/catalog.json scraper/canon-cache.json
          git commit -m "Daily price refresh $(date -u +%Y-%m-%d)" || echo "No changes today"
          git push
