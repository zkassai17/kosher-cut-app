name: Daily price refresh

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC daily (~4-5am US Eastern)
  workflow_dispatch: {} # lets you run it by hand from the Actions tab

permissions:
  contents: write # allow committing the refreshed data.json back

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # crawl (~37m) + first-time AI canonicalization needs headroom
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install scraper deps
        working-directory: scraper
        run: npm install

      - name: Install Chromium
        working-directory: scraper
        run: npx playwright install --with-deps chromium

      - name: Crawl store catalogs
        working-directory: scraper
        env:
          # Canonical product-matching (optional). Add repo secret ANTHROPIC_API_KEY
          # to enable LLM identity matching; without it the app uses its regex
          # matcher and nothing breaks. Set repo variable LLM_PROVIDER=openai +
          # secret OPENAI_API_KEY to use OpenAI instead.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
          # Cap NEW product names canonicalized per run (safety valve). Proven that
          # ~46k fits well within the 90-min budget, so default high; lower via the
          # CANON_MAX_NEW repo variable if a run ever gets tight. Cache carries over.
          CANON_MAX_NEW: ${{ vars.CANON_MAX_NEW || '60000' }}
        run: node catalog.mjs

      - name: Commit refreshed prices
        run: |
          git config user.name "kosher-cut-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json catalog.json scraper/catalog.json scraper/canon-cache.json scraper/cedar-cache.json
          git commit -m "Daily price refresh $(date -u +%Y-%m-%d)" || { echo "No changes"; exit 0; }
          # Integrate anything pushed to main while the run was going (e.g. app-code
          # commits), then push — so a concurrent push never rejects the daily data.
          git pull --rebase origin main
          git push
